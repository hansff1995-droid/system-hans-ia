<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM HANS IA - Sensi FF</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial Black,Arial,sans-serif;
}

body{
    background:
        radial-gradient(circle at top,#26000d 0,#0c0c0c 45%);
    color:#fff;
    min-height:100vh;
}

.top{
    background:linear-gradient(135deg,#ff003c,#b8002c);
    padding:18px 15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:99;
    box-shadow:0 4px 20px rgba(255,0,60,.35);
}

.top h1{
    font-size:20px;
}

.top p{
    font-family:Arial,sans-serif;
    font-size:11px;
    margin-top:5px;
    opacity:.85;
}

.container{
    max-width:1100px;
    margin:auto;
}

.search{
    padding:15px;
}

.search input{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:2px solid #292929;
    background:#151515;
    color:#fff;
    outline:none;
    font-family:Arial,sans-serif;
    font-size:14px;
}

.search input:focus{
    border-color:#ff003c;
    box-shadow:0 0 15px rgba(255,0,60,.2);
}

.controls{
    display:flex;
    gap:8px;
    padding:0 15px 10px;
    overflow-x:auto;
}

.controls button{
    white-space:nowrap;
    border:1px solid #333;
    background:#171717;
    color:#fff;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.controls button.active,
.controls button:hover{
    background:#ff003c;
    border-color:#ff003c;
}

.device{
    margin:5px 15px 10px;
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:12px;
    font-family:Arial,sans-serif;
    font-size:12px;
}

.device strong{
    color:#ff003c;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
    padding:15px;
}

.card{
    background:linear-gradient(145deg,#171717,#101010);
    border:1px solid #292929;
    border-radius:16px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#ff003c;
    box-shadow:0 8px 20px rgba(255,0,60,.15);
}

.phone{
    font-size:25px;
    margin-bottom:8px;
}

.card h3{
    font-size:11px;
    line-height:1.4;
}

.card p{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#777;
    margin-top:6px;
}

.no-results{
    grid-column:1/-1;
    text-align:center;
    padding:30px;
    color:#777;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.box{
    background:#111;
    border:2px solid #ff003c;
    border-radius:20px;
    padding:20px;
    width:100%;
    max-width:400px;
    max-height:90vh;
    overflow-y:auto;
    text-align:center;
    box-shadow:0 0 35px rgba(255,0,60,.25);
}

.box h2{
    color:#ff003c;
    margin-bottom:5px;
}

.subtitle{
    color:#777;
    font-family:Arial,sans-serif;
    font-size:11px;
    margin-bottom:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 5px;
    border-bottom:1px solid #242424;
    font-family:Arial,sans-serif;
}

.row b{
    color:#ff003c;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.btn{
    flex:1;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-family:Arial Black;
}

.copy{
    background:#ff003c;
    color:#fff;
}

.close{
    background:#292929;
    color:#fff;
}

.footer{
    text-align:center;
    color:#555;
    font-family:Arial,sans-serif;
    font-size:10px;
    padding:25px 15px;
}

/* Generador */

.generator{
    margin:5px 15px 15px;
    background:#131313;
    border:1px solid #292929;
    border-radius:18px;
    padding:18px;
}

.generator h2{
    color:#ff003c;
    font-size:16px;
    margin-bottom:12px;
}

.generator label{
    display:block;
    font-family:Arial,sans-serif;
    font-size:12px;
    margin:10px 0 5px;
    color:#bbb;
}

.generator select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #333;
    background:#1c1c1c;
    color:#fff;
}

.generate{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#ff003c;
    color:white;
    font-family:Arial Black;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:15px;
    background:#0c0c0c;
    border-radius:12px;
    padding:12px;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.8;
}

.result b{
    color:#ff003c;
}
</style>
</head>

<body>

<div class="top">
    <h1>SYSTEM HANS IA 🔥</h1>
    <p>SENSIBILIDADES FREE FIRE</p>
</div>

<div class="container">

    <div class="search">
        <input
            id="buscador"
            oninput="filtrar()"
            placeholder="🔍 Busca tu celular..."
            autocomplete="off"
        >
    </div>

    <div class="controls">
        <button class="active" onclick="mostrarTodos(this)">📱 Todos</button>
        <button onclick="filtrarMarca('Redmi',this)">🔴 Redmi</button>
        <button onclick="filtrarMarca('Poco',this)">⚡ Poco</button>
        <button onclick="filtrarMarca('Samsung',this)">🔵 Samsung</button>
        <button onclick="filtrarMarca('Infinix',this)">🔥 Infinix</button>
        <button onclick="filtrarMarca('Tecno',this)">📲 Tecno</button>
        <button onclick="filtrarMarca('Moto',this)">🟢 Moto</button>
        <button onclick="filtrarMarca('Realme',this)">🟡 Realme</button>
        <button onclick="filtrarMarca('iPhone',this)">🍎 iPhone</button>
    </div>

    <div class="device">
        📱 Dispositivo detectado:
        <strong id="deviceName">Detectando...</strong>
    </div>

    <div class="generator">

        <h2>🔥 GENERADOR HANS IA</h2>

        <label>Tipo de juego</label>

        <select id="estilo">
            <option value="rojos">🔥 Rojos / Headshots</option>
            <option value="pvp">⚔️ PvP</option>
            <option value="m1887">💥 M1887 + MP40</option>
            <option value="preciso">🎯 Precisión</option>
        </select>

        <label>Controles</label>

        <select id="dedos">
            <option value="2">2 dedos</option>
            <option value="3">3 dedos</option>
            <option value="4">4 dedos</option>
        </select>

        <button class="generate" onclick="generarSensi()">
            ⚡ GENERAR SENSIBILIDAD
        </button>

        <div class="result" id="resultado"></div>

    </div>

    <div class="grid" id="grid"></div>

</div>

<div
    class="modal"
    id="modal"
    onclick="cerrarModal(event)"
>

    <div class="box">

        <h2 id="mTitle"></h2>

        <div class="subtitle">
            Configuración recomendada
        </div>

        <div id="mBody"></div>

        <div class="buttons">

            <button
                class="btn copy"
                onclick="copiarSensi()"
            >
                📋 COPIAR
            </button>

            <button
                class="btn close"
                onclick="cerrar()"
            >
                CERRAR
            </button>

        </div>

    </div>

</div>

<div class="footer">
    SYSTEM HANS IA • Configuración para Free Fire
</div>

<script>

},

},

},

g:140,r:125,x2:110,x4:95,awm:85,dpi:0
}

];

let seleccionActual = null;

function render(lista){

    const grid = document.getElementById("grid");

    if(lista.length === 0){

        grid.innerHTML =
        `<div class="no-results">
            ❌ No se encontró ese celular.
        </div>`;

        return;
    }

    grid.innerHTML = lista.map(d => {

        const index = data.indexOf(d);

        return `
        <div class="card" onclick="abrir(${index})">

            <div class="phone">📱</div>

            <h3>${d.name}</h3>

            <p>VER SENSI →</p>

        </div>
        `;

    }).join("");
}

function abrir(i){

    const s = data[i];

    seleccionActual = s;

    document.getElementById("mTitle").innerText = s.name;

    document.getElementById("mBody").innerHTML = `

        <div class="row">
            <span>General</span>
            <b>${s.g}</b>
        </div>

        <div class="row">
            <span>Punto Rojo</span>
            <b>${s.r}</b>
        </div>

        <div class="row">
            <span>Mira 2x</span>
            <b>${s.x2}</b>
        </div>

        <div class="row">
            <span>Mira 4x</span>
            <b>${s.x4}</b>
        </div>

        <div class="row">
            <span>AWM</span>
            <b>${s.awm}</b>
        </div>

        <div class="row">
            <span>DPI</span>
            <b>${s.dpi === 0 ? "Sin DPI" : s.dpi}</b>
        </div>

    `;

    document.getElementById("modal").classList.add("show");
}

function cerrar(){

    document
    .getElementById("modal")
    .classList.remove("show");

}

function cerrarModal(e){

    if(e.target.id === "modal"){
        cerrar();
    }

}

function copiarSensi(){

    if(!seleccionActual) return;

    const s = seleccionActual;

    const texto =
`SYSTEM HANS IA 🔥

📱 ${s.name}

General: ${s.g}
Punto Rojo: ${s.r}
Mira 2x: ${s.x2}
Mira 4x: ${s.x4}
AWM: ${s.awm}
DPI: ${s.dpi === 0 ? "Sin DPI" : s.dpi}`;

    navigator.clipboard.writeText(texto)
    .then(() => {

        alert("✅ Sensibilidad copiada");

    })
    .catch(() => {

        alert("No se pudo copiar automáticamente.");

    });
}

function filtrar(){

    const q =
    document
    .getElementById("buscador")
    .value
    .toLowerCase()
    .trim();

    render(
        data.filter(d =>
            d.name.toLowerCase().includes(q)
        )
    );
}

function filtrarMarca(marca,boton){

    activarBoton(boton);

    const q =
    document
    .getElementById("buscador")
    .value
    .toLowerCase()
    .trim();

    render(
        data.filter(d =>
            d.name.toLowerCase().includes(marca.toLowerCase()) &&
            d.name.toLowerCase().includes(q)
        )
    );
}

function mostrarTodos(boton){

    activarBoton(boton);

    document.getElementById("buscador").value = "";

    render(data);

}

function activarBoton(boton){

    document
    .querySelectorAll(".controls button")
    .forEach(b => b.classList.remove("active"));

    boton.classList.add("active");

}

/* GENERADOR */

function generarSensi(){

    const estilo =
    document.getElementById("estilo").value;

    const dedos =
    document.getElementById("dedos").value;

    let s = {

        g:175,
        r:160,
        x2:145,
        x4:130,
        awm:115,
        dpi:400

    };

    if(estilo === "m1887"){

        s.g = 190;
        s.r = 175;
        s.x2 = 150;
        s.x4 = 130;
        s.awm = 110;

    }

    if(estilo === "pvp"){

        s.g = 185;
        s.r = 170;
        s.x2 = 155;
        s.x4 = 135;
        s.awm = 115;

    }

    if(estilo === "preciso"){

        s.g = 165;
        s.r = 150;
        s.x2 = 140;
        s.x4 = 125;
        s.awm = 110;

    }

    if(estilo === "rojos"){

        s.g = 188;
        s.r = 172;
        s.x2 = 150;
        s.x4 = 135;
        s.awm = 115;

    }

    if(dedos === "3"){

        s.g += 2;
        s.r += 2;

    }

    if(dedos === "4"){

        s.g += 4;
        s.r += 4;

    }

    /* Evitar valores superiores a 200 */

    Object.keys(s).forEach(k => {

        if(k !== "dpi" && s[k] > 200){
            s[k] = 200;
        }

    });

    const resultado =
    document.getElementById("resultado");

    resultado.style.display = "block";

    resultado.innerHTML = `

        🎯 <b>CONFIGURACIÓN GENERADA</b><br><br>

        General: <b>${s.g}</b><br>
        Punto Rojo: <b>${s.r}</b><br>
        Mira 2x: <b>${s.x2}</b><br>
        Mira 4x: <b>${s.x4}</b><br>
        AWM: <b>${s.awm}</b><br>
        DPI recomendado: <b>${s.dpi}</b><br>
        Controles: <b>${dedos} dedos</b>

    `;

}

/* DETECCIÓN DEL DISPOSITIVO */

function detectarDispositivo(){

    const ua = navigator.userAgent.toLowerCase();

    let nombre = "Dispositivo no identificado";

    if(ua.includes("m2101k6g")){
        nombre = "Redmi Note 10 Pro";
    }
    else if(ua.includes("redmi")){
        nombre = "Xiaomi Redmi";
    }
    else if(ua.includes("poco")){
        nombre = "POCO";
    }
    else if(ua.includes("samsung")){
        nombre = "Samsung";
    }
    else if(ua.includes("infinix")){
        nombre = "Infinix";
    }
    else if(ua.includes("tecno")){
        nombre = "Tecno";
    }
    else if(ua.includes("motorola") || ua.includes("moto")){
        nombre = "Motorola";
    }
    else if(ua.includes("realme")){
        nombre = "Realme";
    }
    else if(ua.includes("iphone")){
        nombre = "iPhone";
    }

    document.getElementById("deviceName").innerText = nombre;
}

/* INICIO */

render(data);
detectarDispositivo();

</script>
